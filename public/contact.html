<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Cislunar Space and Beyond</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Verdana', sans-serif;
            background: url('./data/cislunar_theme.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            text-align: center;
            overflow: hidden;
        }
        nav {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            position: sticky;
            top: 0;
            z-index: 1000;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 1.2em;
            transition: color 0.3s ease;
        }
        nav ul li a:hover {
            color: #ff0000;
        }
        .contact-form {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 40px;
            width: 50%;
            margin: 50px auto;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        .contact-form input, .contact-form textarea {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            border: none;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1em;
        }
        .contact-form button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #00bfff;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .contact-form button:hover {
            background-color: #007acc;
        }
	 footer {
            margin-top: 50px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            position: absolute;
            bottom: 20px;
            width: 100%;
        }
      
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">About</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="demo.html">Demo</a></li>
            <li><a href="contact.html" style="border-bottom: 2px solid red;">Contact</a></li>
        </ul>
    </nav>

    <h2 style="color: white; text-align: center; margin-top: 30px;">Get in Touch</h2>

    <div class="contact-form">
        <form action="/send-email" method="post">
            <input type="email" name="email" placeholder="Your Email" required><br>
            <input type="text" name="name" placeholder="Your Name" required><br>
            <input type="text" name="company" placeholder="Company Name" required><br>
            <textarea name="message" rows="5" placeholder="Your Message" required></textarea><br>
            <button type="submit">Submit</button>
        </form>
    </div>

    <footer>
        &copy; 2024 Cislunar Space Communication | Boldly going where no one has gone before.
    </footer>
<div id="thank-you-message" style="display: none;">
        <h2 style="color: white; text-align: center; margin-top: 30px;">Thank You for Contacting Us!</h2>
        <p style="color: white; font-size: 1.2em;">We have received your message and will get back to you shortly.</p>
    </div>

    <script>
        document.querySelector('.contact-form form').addEventListener('submit', function(event) {
            event.preventDefault();
            document.querySelector('.contact-form').style.display = 'none';
            document.getElementById('thank-you-message').style.display = 'block';
        });
    </script>
</body>
</html>
